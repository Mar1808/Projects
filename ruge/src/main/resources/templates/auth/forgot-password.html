<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RUGE - Mot de passe oublié</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ruge.png}">
</head>
<body>
<main class="auth-shell">
    <div th:replace='~{fragments/menu :: topMenu}'></div>

    <section class="auth-content">
        <h1>Mot de passe oublié</h1>

        <div class="auth-wrap">
            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <p class="signup-copy" style="margin-bottom: 20px;">
                Saisissez votre adresse e-mail pour recevoir un lien de réinitialisation.
            </p>

            <form th:action="@{/forgot-password}" method="post" class="auth-form">
                <div class="form-panel">
                    <div class="form-group">
                        <label for="email" class="sr-only">Adresse email</label>
                        <div class="field-bar">
                            <span class="field-prefix" aria-hidden="true">
                                <img th:src="@{/images/icon-mail.png}" alt="" class="field-icon">
                            </span>
                            <input type="email" id="email" name="email" placeholder="Adresse email" required autofocus>
                        </div>
                    </div>
                </div>

                <div class="action-stack">
                    <button type="submit" class="auth-btn">Envoyer le lien</button>
                </div>

                <p class="signup-copy" style="margin-top: 20px;">
                    <a th:href="@{/login}">Retour à la connexion</a>
                </p>
            </form>
        </div>
    </section>
</main>
</body>
</html>
