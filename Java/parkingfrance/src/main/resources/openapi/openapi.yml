        '401':
          description: Non authentifié - L’utilisateur n’est pas vérifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '403':
          description: Accès refusé - L’utilisateur n’est pas autorisé à utiliser cette ressource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Erreur interne du serveur - Une erreur inattendue est survenue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - Gestionnaire
      summary: Créer un nouveau parking
      description: |
        Permet à un administrateur d'ajouter un nouveau parking avec ses informations principales :
        nom, adresse, capacité, tarifs, géolocalisation, etc.
      security:
        - ApiKeyAuth: [X-API-KEY]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parking'
      responses:
        '201':
          description: Parking créé avec succès
        '400':
          description: Données invalides - Erreur dans les champs fournis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '401':
          description: Non authentifié - L’utilisateur n’est pas vérifié.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '403':
          description: Accès refusé - L’utilisateur n’est pas autorisé à utiliser cette ressource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Erreur interne du serveur - Une erreur inattendue est survenue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

