openapi: 3.0.1
info:
  title: Parking France
  description: |-
    Parking France API – Trouver une place ne devrait pas être un hasard.

    Cette API fournit des informations en temps réel sur la disponibilité des places
    dans les parkings partenaires en France. Elle permet :
      - aux **usagers** de consulter les parkings disponibles autour d’eux,
        connaître les tarifs, équipements et places libres ;
      - aux **administrateurs (mairies, gestionnaires de parking)** de gérer
        les informations relatives à leurs parkings : création, mise à jour, fermeture,
        maintenance, et gestion des équipements.

    L’objectif est de réduire le stress et la pollution liés à la recherche
    de stationnement, tout en valorisant les gestionnaires de parkings publics
    et privés.  
    
    __**CETTE API N'EXPOSE PAS DE MÉTHODE POUR GÉRER LES GESTIONNAIRES DE PARKING**__  
    Pour devenir gestionnaire de parking sur notre API, il faut nous adresser une demande mail à l’adresse service@parking-france.fr avec tous les documents nécessaires à la validation de votre dossier. Des experts viendront sur place pour valider en personne votre requête et examiner le parking afin de prévoir les installations requises.
    
    
    **Métohdes soumises à authentification**  
    Pour pouvoir utiliser les méthodes admin, vous devez vous authentifié à l'aide d'un token, vous aurez alors accès aux opérations d'ajout, de modifications et de suppréssions sur l'ensemble des parking dont vous êtes considerés comme gérant.  
    Le token devra être transmis dans le header.  
    Un 401 sera renvoyé en cas d'échec d'authentification.  
    Un 403 sera renvoyé si vous n'êtes pas habilité à modifier le parking en question ou que vous n'êtes pas gestionnaire.
  
    <br/>
    ___________ 
    <br/>
    __**Les différents tyes de méthodes**__  
    3 services sont disponibles :
    - __ParkingInfo__ donne des informations sur des informations sur les équipements ainsi que la disponibilité d'un parking afin de faciliter la recherche de parking adapté et disponible à son véhicule où aux contraintes de l'usager.   
      <i><b>Ces méthodes ne sont pas soumises à authentification pour le moment (vouer à évoluer pour sytème de rémunération).</b></i>
    <br>  
    
    - __Position__ ce sont les méthodes se servant d'une localisation pour renvoyer des informations sur des disponibilités. On peut par exemple lister les parkings d'une ville ou demander les places disponible à proximité d'un point donné.  
      <i><b>Ces méthodes ne sont pas soumises à authentification pour le moment (vouer à évoluer pour sytème de rémunération).</b></i>
    <br> 
    
    - __Gestionnaire__ ce sont les méthodes sevrant aux gestionnaires de parking pour modifier des informations sur leur parking. Par exemple si une place devient temporairement indisponible où que l'ascenseur est en panne, les gestionnaires seront en mesure de modifier les informations de leur(s) parking(s). Les informations pourront aussi être modifier par des super-administrateurs (créateurs de l'api dont les méthodes ne sont pas exposées) si ils remarquent des abus (mensonges des gestionnaires) ou des informations supplémentaires sur les caméras.  
      Ils auront également la possibilité de soumettre des créations de parking et de supprimer leur parking).  
      <i><b>Ces méthodes sont soumises à authentification et à autorisations (token à transmettre dans le header).</b></i>
    
  version: 1.0.0

servers:
  - url: http://localhost:8080/


tags:
  - name: ParkingInfo
    description: Avoir des informations à propos d'un parking donné
  - name: Position
    description: Endpoints des méthodes se servant d'une localisation.
  - name: Gestionnaire
    description: Endpoints pour les gestionnaires, afin qu'ils puissent agir sur les places de parking qu'ils gèrent.

paths:
  /parkings/v1/{id}/availability:
    get:
      tags:
        - ParkingInfo
      summary: Obtenir la disponibilité d'un parking avec son id.
      description: Récupérer le nombre de places disponibles, le nombre de places occupées et la capacité totale d'un parking. (option filtrer par type de place)
      operationId: getParkingAvailability
      parameters:
        - name: id
          in: path
          description: ID du parking
          required: true
          schema:
            type: integer
            example: "123"
        - name: spaceType
          in: query
          required: false
          description: >
            Type de place à considérer pour le calcul (optionnel).
            Par défaut `car`.
          schema:
            $ref: '#/components/schemas/ParkingSpaceType'
          example: e_car
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingAvailability"
              examples:
                default-car:
                  summary: Par défaut (voiture)
                  value:
                    available: 42
                    occupied: 158
                    capacity: 200
                ev-only:
                  summary: Filtré sur voitures électriques
                  value:
                    available: 3
                    occupied: 5
                    capacity: 8
        '400':
          description: Invalid ID supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '404':
          description: Parking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          
  /parkings/v1/arounds:
    post:
      tags:
        - Position
      summary: Lister les parkings autour de l'utilisateur
      description: | 
        Retourne la liste des parkings disponibles autour de la position
        en temps réel de l'utilisateur avec les disponibilités pour le type de place séléctionnée.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPosition'
      responses:
        '200':
          description: Liste des parkings autour de l'utilisateur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParkingAvailability'
        '404':
          description: Aucun parking trouvé à proximité
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          
  /parkings/v1/arounds/prediction:
    post:
      tags: 
        - Position
      summary: Prédire le nombre de places disponibles dans une zone à une date donnée.
      description: | 
        Obtenir le nombre de places qui devraient être disponibles à une date précise dans le futur dans un rayon paramétrable. 
        Cette prédiction est faite avec notre moteur de prédiction qui utilise diverses données. 
        Elle est sujette à erreur car il subsistera toujours des incertitudes. 
        L'utilisateur pourra aussi spécifier son type de véhicule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionRequestArounds'
      responses:
        '200':
          description: Liste des parkings avec le nombre de places qui devraient être disponibles dans la zone
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParkingAvailabilityPrediction'
        '404':
          description: Aucun parking trouvé à proximité
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          
  /parkings/v1/city/{city}:
    get:
      tags: 
        - Position
      summary: Lister les parkings dans une ville donnée
      description: | 
        Retourne la liste des parkings disponibles dans une ville spécifique.
      operationId: getParkingsByCity
      parameters:
        - name: city
          in: path
          description: Nom de la ville
          required: true
          schema:
            type: string
            example: "Paris"
      responses:
        '200':
          description: Liste des parkings trouvés dans la ville
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parking'
        '404':
          description: Aucun parking trouvé dans cette ville
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /parkings/v1/{id}/equipments:
    get:
      tags:
        - ParkingInfo
      summary: Avoir les informations d'un parking
      description: |
        Permet de retrouver toutes les informations sur un parking donné. 
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Parking trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parking'
        '404':
          description: Parking introuvable
          content:
            application/json:
              schema:
