      summary: Prédire le nombre de places disponibles dans un parkin à une date donnée.
      description: | 
        Obtenir le nombre de places qui devraient être disponibles à une date précise dans le futur dans un rayon paramétrable. 
        Cette prédiction est faite avec notre moteur de prédiction qui utilise diverses données. 
        Elle est sujette à erreur car il subsistera toujours des incertitudes. 
        L'utilisateur pourra aussi spécifier son type de véhicule.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionRequestParking'
      responses:
        '200':
          description: Liste des parkings avec le nombre de places qui devraient être disponibles dans la zone
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParkingAvailabilityPrediction'
        '404':
          description: Aucun parking trouvé à proximité
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  
  /admin/v1/parkings:
    get:
      tags:
        - Gestionnaire
      summary: Retrouver tous les parkings (Admin)
      description: |
        Récupère la liste complète des parkings gérés par les administrateurs.
      security:
        - ApiKeyAuth: [X-API-KEY]
      responses:
