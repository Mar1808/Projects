components:
  securitySchemes:
      ApiKeyAuth: # arbitrary name for the security scheme
        type: apiKey
        in: header # can be "header", "query" or "cookie"
        name: X-API-KEY # name of the header, query parameter or cookie
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
      required:
        - code
        - message
    ParkingAvailability:
      type: object
      additionalProperties: false
      description: >
        État d’occupation d’un parking à un instant donné, éventuellement
        pour un type de place spécifique (via le paramètre `spaceType`).
      properties:
        parking:
          $ref: '#/components/schemas/Parking'
        available:
          type: integer
          minimum: 0
          description: Nombre de places disponibles.
          example: 45
        occupied:
          type: integer
          minimum: 0
          description: Nombre de places occupées.
          example: 165
        capacity:
          type: integer
          minimum: 0
          description: Capacité totale du parking (les places fermées temporairement n'apparaissent pas).
          example: 210
      required:
        - available
        - occupied
        - capacity

    ParkingSpaceType:
      type: string
      description: Type de place de stationnement.
      enum:
        - car
        - e_car
        - disabled
        - truck
        - bike
        - motorcycle
        - bus
        - van
      default: car

    Parking:
      required:
        - id
        - name
        - address
        - information
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: Indigo
        address:
          $ref: '#/components/schemas/Address'
        information:
          $ref: '#/components/schemas/ParkingInfo'

    Address:
      type: object
      required:
        - street
        - city
        - postalCode
        - country
      properties:
        street:
          type: string
          example: "10 rue de la paix"
        postalCode:
          type: string
          example: "75001"
        city:
          type: string
          example: "Paris"
        country:
          type: string
          example: "France"
        position:
          $ref: '#/components/schemas/Position'

    Space:
      type: object
      required:
        - id
        - type
        - tempClosedSpace
      properties:
        id:
          type: integer
          example: 42
        type:
          $ref: '#/components/schemas/ParkingSpaceType'
        tempClosedSpace:
          type: boolean
          example: true
        topology:
          $ref: '#/components/schemas/Topology'

    UserPosition:
      type: object
      required:
        - vehicle
        - position
        - radius
      properties:
        vehicle:
          $ref: '#/components/schemas/ParkingSpaceType'
        position:
          $ref: '#/components/schemas/Position'
        radius:
          type: integer
          format: int32
          minimum: 1
          maximum: 5000
          example: 500
          description: Le rayon de recherche en mètres autour du point donné.
          
    PredictionRequestArounds:
      type: object
      required:
        - userPosition
        - targetDate
      properties:
        userPosition:
          $ref: '#/components/schemas/UserPosition'
        targetDate:
          type: string
          format: date-time
          example: '2025-10-19T19:35:00+02:00'
          description: Date et heure utilisées pour la prédiction des disponibilités.
          
    PredictionRequestParking:
      type: object
      required:
        - targetDate
        - vehicle
      properties:
        vehicle:
          $ref: '#/components/schemas/ParkingSpaceType'
        targetDate:
          type: string
          format: date-time
          example: '2025-10-19T19:35:00+02:00'
          description: Date et heure utilisées pour la prédiction des disponibilités.


    Position:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: float
          example: 48.8600
        longitude:
          type: number
          format: float
          example: 2.3330

    ParkingInfo:
      type: object
      required:
        - places
      properties:
        price:
          type: integer
          format: int64
          example: 2
        places:
          type: array
          items:
            $ref: '#/components/schemas/Space'
        Equipments:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'

    Equipment:
      type: string
      enum:
        - Toilets
        - Elevator
        - Video surveillance
        - EV charging station
        - Bike station
        - Motorcycle station
        - Disabled

    EquipmentRequest:
      type: object
      required:
        - equipments
      properties:
        equipments:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'

    Topology:
      type: object
      description: Décrit la structure spatiale d’une place dans le parking.
      properties:
        zone:
          type: string
          example: "Zone A"
          description: Zone du parking où se trouve la place.
        niveau:
          type: integer
          example: 1
          description: Niveau ou étage du parking.
        position:
          $ref: '#/components/schemas/Position'


    ParkingPrediction:
      required:
        - id
        - name
        - address
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: Indigo
        address:
          $ref: '#/components/schemas/Address'
          
    ParkingAvailabilityPrediction:
      type: object
      additionalProperties: false
      description: >
        État d’occupation des parkings dans une zone à un instant donné, éventuellement
        pour un type de place spécifique (via le paramètre `spaceType`).
      properties:
        parking:
          $ref: '#/components/schemas/ParkingPrediction'
        available:
          type: integer
          minimum: 0
          description: Nombre de places disponibles.
          example: 45
        occupied:
          type: integer
          minimum: 0
          description: Nombre de places occupées.
          example: 165
        capacity:
          type: integer
          minimum: 0
          description: Capacité totale du parking (les places fermées temporairement n'apparaissent pas).
          example: 210
      required:
        - parking
        - available
        - occupied
        - capacity
