  <section class="create-section">
    <h3>Éditer un parking</h3>
    <form class="create-form">
      <div>
        <label>Nom *</label>
        <input [(ngModel)]="parking.name" name="name" required />
      </div>
      <div>
        <label>Rue *</label>
        <input [(ngModel)]="parking.address.street" name="street" required />
      </div>
      <div>
        <label>Ville *</label>
        <input [(ngModel)]="parking.address.city" name="city" required />
      </div>
      <div>
        <label>Code postal</label>
        <input [(ngModel)]="parking.address.postalCode" name="postalCode" />
      </div>
      <div>
        <label>Pays</label>
        <input [(ngModel)]="parking.address.country" name="country" />
      </div>
      <div>
        <label>Prix (€/h)</label>
        <input type="number" [(ngModel)]="parking.information.price" name="price" min="0" />
      </div>
      <div class="equipments-field" style="grid-column:1/-1;">
        <label>Équipements</label>
        <div style="display:flex; flex-wrap:wrap; gap:1rem;">
          <!-- <ng-container *ngFor="let eq of equipmentEnum let i = index">
            <label style="display:flex;align-items:center;gap:.5rem;">
              <input type="checkbox"
                [checked]="equipmentChecked[i]"
                (change)="checked(i)" />
              {{ eq }}
            </label>
          </ng-container> -->
        </div>
      </div>
      <fieldset>
        <legend>Places</legend>
        <div style="display:flex; gap:1rem; flex-wrap:wrap; align-items:center;">
          <!-- <div>
            <label>Nombre de places</label>
            <input type="number" [(ngModel)]="spacesCount" name="spacesCount" min="0" (change)="refreshSpaces()" />
          </div> -->
          <!-- <div>
            <label>Tout fermer temporairement ?</label>
            <input type="checkbox" [(ngModel)]="tempClosedAll" name="tempClosedAll" (change)="refreshSpaces()" />
          </div> -->
        </div>
        <div class="spaces-config" *ngIf="parking.information.places.length > 0">
          <div class="space-item" *ngFor="let sp of parking.information.places; let i = index">
            <label>Place #{{ sp.topology?.zone }}</label>
            <select [(ngModel)]="sp.type" name="spaceType{{i}}" (change)="updateSpaceType(i, sp.type)">
              <option *ngFor="let t of spaceTypes" [value]="t">{{ t }}</option>
            </select>
            <div>
              <label>Fermée ?</label>
              <input type="checkbox" [(ngModel)]="sp.tempClosedSpace" name="tempClosed{{i}}" />
            </div>
          </div>
        </div>
      </fieldset>
      <!-- <button type="submit" [disabled]="creating">{{ creating ? 'Création...' : 'Créer le parking' }}</button>
      <button type="button" class="secondary" (click)="resetForm()" [disabled]="creating">Réinitialiser</button> -->
    </form>
  </section>
