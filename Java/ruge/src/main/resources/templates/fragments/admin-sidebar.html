<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="adminSidebar(activeTab)" class="admin-sidebar" id="adminSidebar">

    <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Plier le menu">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <nav class="sidebar-nav">

        <a th:href="@{/admin/users}"
           class="sidebar-link"
           th:classappend="${activeTab == 'users'} ? 'active' : ''">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            <span class="sidebar-text">Utilisateurs</span>
        </a>

        <a th:href="@{/admin/recipes}"
           class="sidebar-link"
           th:classappend="${activeTab == 'recipes'} ? 'active' : ''">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
            <span class="sidebar-text">Recettes</span>
        </a>

        <a th:href="@{/admin/promotions}"
           class="sidebar-link"
           th:classappend="${activeTab == 'promotions'} ? 'active' : ''">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M7 4h10a2 2 0 012 2v12a2 2 0 01-2 2H7a2 2 0 01-2-2V6a2 2 0 012-2z"></path>
            </svg>
            <span class="sidebar-text">Promotions</span>
        </a>

        <a th:href="@{/admin/finances}"
           class="sidebar-link"
           th:classappend="${activeTab == 'finances'} ? 'active' : ''">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span class="sidebar-text">Finances</span>
        </a>

        <a th:href="@{/admin/statistics}"
           class="sidebar-link"
           th:classappend="${activeTab == 'statistics'} ? 'active' : ''">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 14l3-3 3 2 4-5"></path>
            </svg>
            <span class="sidebar-text">Statistiques</span>
        </a>

        <a th:href="@{/admin/terms}"
           class="sidebar-link"
           th:classappend="${activeTab == 'terms'} ? 'active' : ''">
            <svg class="sidebar-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M7 4h10a2 2 0 012 2v12a2 2 0 01-2 2H7a2 2 0 01-2-2V6a2 2 0 012-2z"></path>
            </svg>
            <span class="sidebar-text">Charte</span>
        </a>

    </nav>
</aside>

</body>
</html>
