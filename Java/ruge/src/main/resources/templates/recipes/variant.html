<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer une variante</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/recipes.css}">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ruge.png}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div th:replace='~{fragments/menu :: topMenu}'></div>

<div class="container">

    <!-- NAV -->
    <div class="rr-nav-bar">
        <div class="back-links">
            <a th:href="@{/recipes/{id}(id=${recipe.id})}" class="btn-secondary">
                <i class="fa-solid fa-arrow-left"></i> Recette originale
            </a>
        </div>
    </div>

    <!-- PAGE HEADER -->
    <div class="form-page-hero">
        <div class="form-page-icon"><i class="fa-solid fa-code-fork"></i></div>
        <div>
            <h1 class="form-page-title">Créer une variante</h1>
            <p class="form-page-subtitle">
                de « <span th:text="${recipe.name}" class="form-page-recipe-name"></span> »
            </p>
        </div>
    </div>

    <p class="form-hint-banner">
        <i class="fa-solid fa-circle-info"></i>
        Les éléments originaux sont affichés en lecture seule. Supprimez ceux que vous n'utilisez pas, ajoutez-en de nouveaux, puis donnez un titre à votre variante.
    </p>

    <form id="variantForm" method="post"
          th:action="@{/recipes/{id}/variant(id=${recipe.id})}">

        <!-- ══════════════════════════════════
             INFORMATIONS GÉNÉRALES
        ══════════════════════════════════ -->
        <div class="card form-card">
            <h2 class="form-section-title">
                <span class="form-section-icon"><i class="fa-solid fa-pen-nib"></i></span>
                Informations générales
            </h2>

            <div class="form-group">
                <label for="name">Titre de la variante <span class="required">*</span></label>
                <input type="text" id="name" name="name"
                       th:value="${recipe.name + ' (variante)'}" required/>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4"
                          th:text="${recipe.description}"></textarea>
            </div>
        </div>

        <!-- ══════════════════════════════════
             ÉTAPES
        ══════════════════════════════════ -->
        <div class="card form-card">
            <h2 class="form-section-title">
                <span class="form-section-icon"><i class="fa-solid fa-list-ol"></i></span>
                Étapes de préparation
            </h2>

            <div id="stepsContainer">
                <!-- Bouton insertion avant la 1re étape -->
                <button type="button" class="insert-step-btn" onclick="insertStep(0)">
                    <i class="fa-solid fa-plus"></i> Ajouter une étape ici
                </button>

                <th:block th:each="step, iterStat : ${recipe.steps}">
                    <div class="step-row original-step" th:attr="data-index=${iterStat.index}">

                        <input type="hidden" th:name="|steps[${iterStat.index}].original|" value="true"/>
                        <input type="hidden" th:name="|steps[${iterStat.index}].deleted|"
                               th:id="|deletedFlag_${iterStat.index}|" value="false"/>

                        <span class="step-number" th:text="${iterStat.count}"></span>

                        <div class="step-body">
                            <textarea class="step-text"
                                      th:name="|steps[${iterStat.index}].step|"
                                      readonly
                                      th:text="${step.step}"></textarea>

                            <div class="step-duration-row">
                                <i class="fa-regular fa-clock"></i>
                                <label th:for="|dur_${iterStat.index}|">Durée (min) :</label>
                                <input type="number"
                                       th:id="|dur_${iterStat.index}|"
                                       th:name="|steps[${iterStat.index}].duration|"
                                       th:value="${step.duration}"
                                       min="0" readonly/>
                            </div>
                        </div>

                        <div class="step-actions">
                            <button type="button" class="btn-delete-toggle"
                                    th:attr="data-index=${iterStat.index}"
                                    onclick="toggleDeleteStep(this)">
                                <i class="fa-solid fa-trash-can"></i> Supprimer
                            </button>
                        </div>
                    </div>

                    <button type="button" class="insert-step-btn"
                            th:attr="onclick=|insertStep(${iterStat.index + 1})|">
                        <i class="fa-solid fa-plus"></i> Ajouter une étape ici
                    </button>
                </th:block>
            </div>
        </div>

        <!-- ══════════════════════════════════
             INGRÉDIENTS
        ══════════════════════════════════ -->
        <div class="card form-card">
            <h2 class="form-section-title">
                <span class="form-section-icon"><i class="fa-solid fa-basket-shopping"></i></span>
                Ingrédients
            </h2>

            <div id="ingredientsContainer">
                <th:block th:each="ing, iterStat : ${recipe.ingredients}">
                    <div class="ingredient-row original-ingredient" th:attr="data-index=${iterStat.index}">

                        <input type="hidden" th:name="|ingredients[${iterStat.index}].original|" value="true"/>
                        <input type="hidden" th:name="|ingredients[${iterStat.index}].deleted|"
                               th:id="|ingDeletedFlag_${iterStat.index}|" value="false"/>

                        <div class="ing-fields">
                            <input type="text" class="ingredient-field field-name"
                                   th:name="|ingredients[${iterStat.index}].name|"
                                   th:value="${ing.name}" readonly/>
                            <input type="text" class="ingredient-field field-qty"
                                   th:name="|ingredients[${iterStat.index}].quantity|"
                                   th:value="${ing.quantity}" placeholder="Qté" readonly/>
                        </div>

                        <button type="button" class="btn-delete-toggle"
                                th:attr="data-index=${iterStat.index}"
                                onclick="toggleDeleteIngredient(this)">
                            <i class="fa-solid fa-trash-can"></i> Supprimer
                        </button>
                    </div>
                </th:block>
            </div>

            <button type="button" class="btn-add-item" onclick="addIngredient()">
                <i class="fa-solid fa-plus"></i> Ajouter un ingrédient
            </button>
        </div>

        <!-- SUBMIT -->
        <div class="form-submit-bar">
            <a th:href="@{/recipes/{id}(id=${recipe.id})}" class="btn-secondary">
                <i class="fa-solid fa-xmark"></i> Annuler
            </a>
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-code-fork"></i> Créer la variante
            </button>
        </div>

    </form>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    let stepCounter = /*[[${recipe.steps.size()}]]*/ 0;
    let ingCounter  = /*[[${recipe.ingredients.size()}]]*/ 0;

    function renumberSteps() {
        const rows = document.getElementById('stepsContainer').querySelectorAll('.step-row');
        let n = 1;
        rows.forEach(row => {
            const numEl = row.querySelector('.step-number');
            if (numEl) numEl.textContent = n++;
        });
    }

    function toggleDeleteStep(btn) {
        const row   = btn.closest('.step-row');
        const index = btn.getAttribute('data-index');
        const flag  = document.getElementById('deletedFlag_' + index);
        const willDelete = flag.value === 'false';
        flag.value = willDelete ? 'true' : 'false';
        row.classList.toggle('deleted', willDelete);
        btn.innerHTML = willDelete
            ? '<i class="fa-solid fa-rotate-left"></i> Restaurer'
            : '<i class="fa-solid fa-trash-can"></i> Supprimer';
        btn.classList.toggle('restore', willDelete);
    }

    function insertStep(insertAfterIndex) {
        const container = document.getElementById('stepsContainer');
        const allBtns   = Array.from(container.querySelectorAll('.insert-step-btn'));
        const idx = stepCounter++;

        const row = document.createElement('div');
        row.className = 'step-row new-step';
        row.dataset.newIndex = idx;
        row.innerHTML = `
        <input type="hidden" name="steps[${idx}].original" value="false"/>
        <input type="hidden" name="steps[${idx}].deleted"  value="false"/>
        <span class="step-number">?</span>
        <div class="step-body">
            <textarea class="step-text" name="steps[${idx}].step"
                      placeholder="Décrivez cette étape..." required></textarea>
            <div class="step-duration-row">
                <i class="fa-regular fa-clock"></i>
                <label>Durée (min) :</label>
                <input type="number" name="steps[${idx}].duration" min="0" value="0"/>
            </div>
        </div>
        <div class="step-actions">
            <button type="button" class="btn-remove-new" onclick="removeNewStep(this)">
                <i class="fa-solid fa-xmark"></i> Retirer
            </button>
        </div>`;

        const newInsertBtn = document.createElement('button');
        newInsertBtn.type = 'button';
        newInsertBtn.className = 'insert-step-btn';
        newInsertBtn.innerHTML = '<i class="fa-solid fa-plus"></i> Ajouter une étape ici';

        const refBtn = allBtns[insertAfterIndex];
        refBtn.insertAdjacentElement('afterend', newInsertBtn);
        refBtn.insertAdjacentElement('afterend', row);

        newInsertBtn.addEventListener('click', () => {
            const btns = Array.from(document.getElementById('stepsContainer').querySelectorAll('.insert-step-btn'));
            insertStep(btns.indexOf(newInsertBtn));
        });

        renumberSteps();
    }

    function removeNewStep(btn) {
        const row = btn.closest('.step-row');
        const nextBtn = row.nextElementSibling;
        if (nextBtn && nextBtn.classList.contains('insert-step-btn')) nextBtn.remove();
        row.remove();
        renumberSteps();
    }

    function toggleDeleteIngredient(btn) {
        const row   = btn.closest('.ingredient-row');
        const index = btn.getAttribute('data-index');
        const flag  = document.getElementById('ingDeletedFlag_' + index);
        const willDelete = flag.value === 'false';
        flag.value = willDelete ? 'true' : 'false';
        row.classList.toggle('deleted', willDelete);
        btn.innerHTML = willDelete
            ? '<i class="fa-solid fa-rotate-left"></i> Restaurer'
            : '<i class="fa-solid fa-trash-can"></i> Supprimer';
        btn.classList.toggle('restore', willDelete);
    }

    function addIngredient() {
        const container = document.getElementById('ingredientsContainer');
        const idx = ingCounter++;
        const row = document.createElement('div');
        row.className = 'ingredient-row new-ingredient';
        row.innerHTML = `
        <input type="hidden" name="ingredients[${idx}].original" value="false"/>
        <input type="hidden" name="ingredients[${idx}].deleted"  value="false"/>
        <div class="ing-fields">
            <input type="text"  class="ingredient-field field-name"
                   name="ingredients[${idx}].name" placeholder="Nom de l'ingrédient" required/>
            <input type="text"  class="ingredient-field field-qty"
                   name="ingredients[${idx}].quantity" placeholder="Quantité"/>
        </div>
        <button type="button" class="btn-remove-new" onclick="removeIngredient(this)">
            <i class="fa-solid fa-xmark"></i> Retirer
        </button>`;
        container.appendChild(row);
    }

    function removeIngredient(btn) { btn.closest('.ingredient-row').remove(); }

    document.getElementById('variantForm').addEventListener('submit', function () {
        reindexFields('stepsContainer',       'step-row',       'steps');
        reindexFields('ingredientsContainer', 'ingredient-row', 'ingredients');
    });

    function reindexFields(containerId, rowClass, prefix) {
        const rows = document.getElementById(containerId).querySelectorAll('.' + rowClass);
        rows.forEach((row, newIndex) => {
            row.querySelectorAll('input, textarea').forEach(field => {
                if (field.name) field.name = field.name.replace(new RegExp(prefix + '\\[\\d+\\]'), prefix + '[' + newIndex + ']');
                if (field.id)   field.id   = field.id.replace(  new RegExp(prefix + '\\[\\d+\\]'), prefix + '[' + newIndex + ']');
            });
        });
    }
    /*]]>*/
</script>
</body>
</html>
