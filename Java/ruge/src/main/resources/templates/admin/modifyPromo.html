<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Admin - Promotions | RUGE</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo-ruge.png}">
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
</head>
<body>

<div th:replace='~{fragments/menu :: topMenu}'></div>

<div class="admin-layout">

    <div th:replace="~{fragments/admin-sidebar :: adminSidebar('promotions')}"></div>

    <main class="admin-container">
        <header class="page-header">
            <h1>Administration — Promotions</h1>
        </header>

        <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

        <h2 class="section-title" style="margin-top: 0; font-size: 20px;">Modifier une promotion</h2>

        <div style="display: flex; gap: 20px; flex-wrap: wrap;">

            <div class="table-card" style="padding: 20px; flex: 1; min-width: 450px;">
                <h3 style="margin-top: 0; font-size: 16px; border-bottom: 2px solid #eee; padding-bottom: 10px;">Promotions Classiques (Likes / IA)</h3>
                <form id="standardPromoForm" th:action="@{/admin/promotion/{id}/modify(id=${promotion.id})}" method="post" style="display: flex; gap: 15px; flex-direction: column; align-items: flex-start;">
                    <div th:if="${promotion.isActive()}" class="alert-error">Modification restrainte (Promotion en cours) </div>
                    <div style="width: 100%;" th:if="${!promotion.isActive()}">
                        <label for="standardPromoPrice" style="font-weight: bold; display: block; margin-bottom: 5px;">Prix promo (€)</label>
                        <input type="number" step="0.01" min="0" id="standardPromoPrice" name="promoPrice"
                               th:value="${promotion.promoPrice}"
                               class="admin-input" placeholder="Ex: 0.50" required style="width: 100%;"
                               onkeypress="return (event.charCode !=8 && event.charCode ==0 || (event.charCode >= 48 && event.charCode <= 57) || event.charCode == 46 || event.charCode == 44)">
                    </div>

                    <div style="width: 100%;" th:if="${!promotion.isActive()}">
                        <label for="standardStartDate" style="font-weight: bold; display: block; margin-bottom: 5px;">Début</label>
                        <input type="datetime-local" id="standardStartDate" name="startDate" class="admin-input" required style="width: 100%;" th:value="${promotion.startDate()}">
                    </div>

                    <div style="width: 100%;">
                        <label for="standardEndDate" style="font-weight: bold; display: block; margin-bottom: 5px;">Fin</label>
                        <input type="datetime-local" id="standardEndDate" name="endDate" class="admin-input" required style="width: 100%;" th:value="${promotion.endDate()}">
                    </div>

                    <div style="margin-top: 10px;">
                        <button type="submit" class="btn btn-primary" style="background-color: #d1b88e; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; color: white; font-weight: bold;">
                            Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

</body>
</html>
