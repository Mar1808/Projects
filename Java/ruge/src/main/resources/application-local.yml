spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5432}/${LOCAL_DB_NAME:ruge}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}

  flyway:
    locations: classpath:db/migration,classpath:db/migration-local
