spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${APP_DB_PROFILE:centralized}

  devtools:
    restart:
      enabled: true

  application:
    name: ruge

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  web:
    resources:
      static-locations: classpath:/static/

  security:
    oauth2:
      client:
        registration:
          gitlab:
            client-id: ${GITLAB_CLIENT_ID}
            client-secret: ${GITLAB_CLIENT_SECRET}
            client-name: GitLab
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - read_user
        provider:
          gitlab:
            authorization-uri: https://gitlab.com/oauth/authorize
            token-uri: https://gitlab.com/oauth/token
            user-info-uri: https://gitlab.com/api/v4/user
            user-name-attribute: email

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            trust: ${MAIL_SMTP_SSL_TRUST:${MAIL_HOST:smtp-relay.brevo.com}}
          starttls:
            enable: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: phi3
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:mxbai-embed-large}
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        table-name: recipe_ai  # Explicit table name because Spring AI created a default table.

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  superlike:
    redistribution:
      # Automatic schedule for redistribution (cron format: sec min hour day month dayOfWeek)
      cron: "0 0 0 1 * *"
      zone: "Europe/Paris"

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  currency: ${STRIPE_CURRENCY:eur}
  connect-country: ${STRIPE_CONNECT_COUNTRY:FR}

jwt:
  secret: ${SECRET_JWT}