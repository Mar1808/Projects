<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RUGE - Réinitialiser le mot de passe</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="icon" type="image/png" th:href="@{/images/logo-ruge.png}">
</head>
<body>
<main class="auth-shell">
    <div th:replace='~{fragments/menu :: topMenu}'></div>

    <section class="auth-content">
        <h1>Nouveau mot de passe</h1>

        <div class="auth-wrap">
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <div th:if="${message}">
                <div class="alert alert-success" th:text="${message}"></div>
                <p class="signup-copy" style="margin-top: 20px;">
                    <a th:href="@{/login}">Aller à la page de connexion</a>
                </p>
            </div>

            <form th:if="${error == null and message == null}" th:action="@{/reset-password}" method="post" class="auth-form">

                <input type="hidden" name="token" th:value="${token}" />

                <div class="form-panel">
                    <div class="form-group">
                        <label for="password" class="sr-only">Nouveau mot de passe</label>
                        <div class="field-bar">
                            <span class="field-prefix" aria-hidden="true">
                                <img th:src="@{/images/icon-lock.png}" alt="" class="field-icon">
                            </span>
                            <input type="password" id="password" name="password" placeholder="Nouveau mot de passe" required autofocus>
                        </div>
                    </div>
                </div>

                <div class="action-stack">
                    <button type="submit" class="auth-btn">Sauvegarder le mot de passe</button>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
