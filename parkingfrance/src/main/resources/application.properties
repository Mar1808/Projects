#shutdown=true option forces the database to write any unsaved data to disk and close cleanly.
spring.datasource.url=jdbc:hsqldb:file:./data/parkingFrance;shutdown=true
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect
#update the database on startup instead of deleting.
spring.jpa.hibernate.ddl-auto=update
#identification
spring.datasource.username=sa
spring.datasource.password=

